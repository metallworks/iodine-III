<title>Iodine III</title>

<style>
  /* Boot flow only - the rest of the UI is styled by assets/app.css */

  /* Health warning, PlayStation style. The order is the console's:
     Metalworks loader -> pick your user -> the warning, laid over the
     wallpaper BLURRED, for two seconds -> home. It used to sit on top of
     the loader from the first frame, which hid the loader entirely. */
  #epilepsy-warning {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 32px; text-align: center;
    background: rgba(0, 0, 0, .32);
    -webkit-backdrop-filter: blur(26px) saturate(.8);
    backdrop-filter: blur(26px) saturate(.8);
    color: #f0f0f0;
    font-family: 'CanvasSans', system-ui, sans-serif;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .6s ease, visibility .6s ease;
  }
  #epilepsy-warning.shown { opacity: 1; visibility: visible; pointer-events: auto; }
  #epilepsy-warning.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #epilepsy-warning .ew-mark {
    width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid #d4af37; color: #d4af37;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem; font-weight: 600;
  }
  #epilepsy-warning h1 {
    margin: 0; font-size: 1.15rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: #d4af37;
  }
  #epilepsy-warning p {
    margin: 0; max-width: 520px; font-size: .95rem; line-height: 1.55; opacity: .82;
  }
  @media (prefers-reduced-motion: reduce) {
    #epilepsy-warning { transition: opacity .2s ease, visibility .2s ease; }
  }

  #loading-screen {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: #141414;
    transition: opacity .4s ease, visibility .4s ease;
  }
  .loader-wrapper { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
  .loader-image { position: absolute; width: 76px; height: 76px; border-radius: 50%; object-fit: cover; z-index: 2; }
  .progress-ring { position: absolute; z-index: 1; transform: rotate(-90deg); }
  .progress-ring__circle { stroke-dasharray: 339.29; stroke-dashoffset: 339.29; }

  .screen {
    position: fixed; inset: 0; z-index: 10;
    opacity: 0; visibility: hidden;
    transition: opacity .4s ease, visibility .4s ease;
  }
  .screen.visible { opacity: 1; visibility: visible; }

  .layout {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: 30px; width: 100%; max-width: 1200px; padding: 20px;
  }
  .brand-logo-img { max-width: 180px; }
  .device-content { display: flex; flex-direction: column; align-items: center; gap: 45px; }
  .headline-text-img { max-width: 500px; }
  .welcome-text-img { max-width: 450px; }
  .grid { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .device-btn-img { width: 230px; cursor: pointer; transition: transform .2s, filter .2s; }
  .device-btn-img:hover { transform: scale(1.03); filter: brightness(1.15); }

  .user-row-container { display: flex; align-items: center; justify-content: center; gap: 35px; flex-wrap: wrap; width: 100%; }
  #saved-users-box { display: flex; align-items: center; justify-content: center; gap: 35px; flex-wrap: wrap; }
  .user-node { position: relative; display: flex; flex-direction: column; align-items: center; gap: 15px; width: 140px; cursor: pointer; }
  .user-circle-pfp {
    width: 120px; height: 120px; border-radius: 50%;
    background: #252525 center/cover no-repeat;
    border: 3px solid transparent; transition: all .2s ease;
  }
  .user-node:hover .user-circle-pfp { transform: scale(1.08); border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,.3); }
  .user-node-name {
    display: flex; align-items: center; gap: 5px;
    max-width: 140px; font-size: 1rem; font-weight: 500; color: #aaa;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .2s;
  }
  .user-node:hover .user-node-name { color: #fff; }
  .verified-badge { color: var(--accent); }
  .user-delete-btn {
    position: absolute; top: -8px; right: 10px; z-index: 3;
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.75); border: 2px solid rgba(255,255,255,.4);
    color: #fff; font-size: .85rem; line-height: 1; cursor: pointer;
    opacity: .75; transition: opacity .2s, background .2s, transform .2s;
  }
  .user-node:hover .user-delete-btn, .user-delete-btn:focus-visible { opacity: 1; }
  .user-delete-btn:hover { background: #ff4d4d; transform: scale(1.12); }

  .ps-add-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 140px; cursor: pointer; }
  .ps-add-btn {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.07); border: 3px dashed rgba(255,255,255,.3);
    font-size: 2.5rem; color: #aaa; transition: all .2s ease;
  }
  .ps-add-wrapper:hover .ps-add-btn { transform: scale(1.08); border-color: #fff; background: rgba(255,255,255,.15); color: #fff; }

  .overlay { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
  .popup {
    position: relative; width: 90%; max-width: 750px; padding: 40px;
    background: rgba(10,10,10,.95); border: 3px solid #fff; border-radius: 24px;
  }
  .popup-title { margin-bottom: 25px; text-align: center; font-size: 1.1rem; color: #aaa; letter-spacing: 1px; }
  .split-layout { position: relative; display: flex; }
  .split-col { flex: 1; display: flex; flex-direction: column; padding: 0 20px; }
  .split-divider { position: absolute; left: 50%; top: 10%; bottom: 10%; width: 1px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; }
  .or-badge { padding: 10px 5px; background: #0a0a0a; font-size: 1.1rem; }
  .popup h3 { margin-bottom: 8px; font-size: 1.4rem; font-weight: 500; }
  .desc { margin-bottom: 25px; min-height: 40px; font-size: .85rem; line-height: 1.4; color: #888; }
  .input-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
  .pfp-upload-label {
    flex-shrink: 0; width: 70px; height: 70px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed rgba(255,255,255,.4); background: center/cover no-repeat;
    font-size: .8rem; color: #aaa; cursor: pointer; overflow: hidden;
  }
  .text-input {
    width: 100%; padding: 8px 4px;
    background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,.4);
    color: #fff; font: inherit; font-size: 1rem; outline: none;
  }
  .text-input:focus { border-bottom-color: #fff; }
  .hint-text { margin-top: auto; padding-top: 15px; font-size: .8rem; color: #666; }
  .link { margin-top: 10px; font-size: .8rem; color: #aaa; text-decoration: underline; cursor: pointer; background: none; border: 0; font-family: inherit; }
  .error-msg { display: none; margin-top: 10px; font-size: .8rem; line-height: 1.3; color: #ff4d4d; }

</style>
